name: askmylawyer-staging-local
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: aml_stage
      POSTGRES_PASSWORD: ${AML_STAGING_DB_PASSWORD:?Initialize the private staging environment first}
      POSTGRES_DB: askmylawyer_staging
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - staging-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml_stage -d askmylawyer_staging"]
      interval: 3s
      retries: 30
volumes:
  staging-postgres:
